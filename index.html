/* ---------- نافذة الحوار ---------- */

function dlgClose(v){const d=S.dl;S.dl=null;$('#md').innerHTML='';if(d)d.res(v)}

function barHtml(){const more=!NAV.slice(0,4).some(n=>n.k==S.page);return NAV.slice(0,4).map(n=>`<button class="${n.k==S.page?'on':''}" data-a="go" data-k="${n.k}">${ic(n.i,22)}${n.s||n.t}${bdv(n.k)}</button>`).join('')+`<button class="${more?'on':''}" data-a="more">${ic('grid',22)}المزيد${bdv('more')}</button>`}

function moreSheet(){return`<div class="mdb" data-a="more-x"></div><div class="mds"><div class="mdh"><span>المزيد</span></div><div class="mg">${NAV.slice(4).map(n=>`<button data-a="go" data-k="${n.k}"><span class="chipi" style="background:var(--g)">${ic(n.i,22)}</span>${n.s||n.t}${bdv(n.k)}</button>`).join('')}<button data-a="out"><span class="chipi" style="background:var(--bad)">${ic('logout',22)}</span>خروج</button></div></div>`}
function subTitle(){const s=S.sub;if(!s)return'';if(s.k=='order'||s.k=='arch')return'طلب شحن';if(s.k=='req')return'طلب موديل';if(s.k=='user')return(s.p&&s.p.name)||'حساب';if(s.k=='ed')return(s.row?'تعديل ':'إضافة ')+ED[s.t].t;return''}
function render(){const a=$('#app');
if(S.busy&&!S.user){a.innerHTML='<div class="boot"><div class="spin"></div></div>';return}

/* ---------- الرئيسية والإحصائيات ---------- */
function bars(rows,id,fmt){if(!rows.length)return'';const mx=Math.max(1,...rows.map(r=>r.v)),W=320,H=90,bw=W/rows.length;
return`<svg class="chart" viewBox="0 0 ${W} ${H+22}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A855F7"/><stop offset="1" stop-color="#22B8F5"/></linearGradient></defs>${rows.map((r,i)=>{const h=r.v?Math.max(4,r.v/mx*H):2,x=i*bw+bw/2;return`<rect x="${(i*bw+3).toFixed(1)}" y="${(H-h+10).toFixed(1)}" width="${(bw-6).toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="url(#${id})" opacity="${r.v?1:.25}"/>${r.v?`<text x="${x.toFixed(1)}" y="${(H-h+7).toFixed(1)}" text-anchor="middle">${esc(fmt?fmt(r.v):r.v)}</text>`:''}${i%3==0||i==rows.length-1?`<text x="${x.toFixed(1)}" y="${H+20}" text-anchor="middle">${esc(r.l)}</text>`:''}`}).join('')}</svg>`}
function stat(i,col,l,v,sub){return`<div class="stat">${chip(i,col)}<b>${v}</b><small>${l}</small>${sub?`<br><i>${sub}</i>`:''}</div>`}
function vHome(){const s=S.st,c=S.cnt;
const al=[['pay','coin','#16A34A','طلبات شحن بانتظار المراجعة',c.pay],['reqs','idcard','#7C3AED','طلبات موديلز جديدة',c.reqs],['rep','flag','#DC2626','بلاغات مفتوحة',c.rep]].filter(x=>x[4]);
let h=`<div class="hero"><h2>نظرة عامة</h2><p>ملخص نشاط Batsho</p></div>`;
if(al.length)h+=`<div class="alerts">${al.map(a=>item(chip(a[1],a[2]),num(a[4]),a[3],`<span style="color:var(--m)">${ic('chev',20)}</span>`,`data-a="go" data-k="${a[0]}"`)).join('')}</div>`;
if(S.stErr)return h+`<div class="warn">تعذر تحميل الإحصائيات: ${esc(S.stErr)}<br>تأكد من تشغيل ملف admin-setup.sql.</div>`;
if(!s)return h;
const rev=(s.revenue||[]).filter(r=>r.cents);
h+=`<div class="grid2 w4">${stat('users','#7C3AED','المستخدمون',num(s.users_total),s.users_today?'+'+num(s.users_today)+' اليوم':'')}${stat('pulse','#16A34A','متصلون الآن',num(s.online_now))}${stat('star','#F59E0B','الموديلز',num(s.models_total))}${stat('live','#EF4444','بثوث مباشرة',num(s.lives_active))}</div>
<div class="grid2 w4">${stat('coin','#0EA5E9','المبيعات',rev.length?rev.map(r=>money(r.cents,r.currency)).join('<br>'):'—','طلبات معتمدة: '+num((s.orders||{}).approved))}${stat('trend','#8B5CF6','عملات مباعة',num(s.coins_sold))}${stat('gift','#EC4899','هدايا مُرسلة',num(s.gifts_count),num(s.gifts_coins)+' عملة')}${stat('flag','#DC2626','بلاغات مفتوحة',num(s.reports_open))}</div>`;
const su=(s.signups||[]).map(r=>({l:dte(r.d),v:r.n}));
h+=`<div class="card"><b>تسجيلات جديدة (14 يومًا)</b>${bars(su,'g1')}</div>`;
const rv=s.revday||[];if(rv.length){const tot={};rv.forEach(r=>tot[r.cur||'']=(tot[r.cur||'']||0)+Number(r.cents||0));const main=Object.keys(tot).sort((a,b)=>tot[b]-tot[a])[0],m={};rv.filter(r=>(r.cur||'')==main).forEach(r=>m[r.d]=Number(r.cents||0));
const rows=(s.signups||[]).map(r=>({l:dte(r.d),v:m[r.d]||0}));h+=`<div class="card"><b>المبيعات اليومية (${esc(main||'')})</b>${bars(rows,'g2',v=>Math.round(v/100))}</div>`}
return h}

async function loadPay(){const r=await sb.rpc('admin_orders');if(r.error)throw r.error;

if(ok){if(!await ask('اعتماد الطلب',`تأكد أن المبلغ وصل فعلًا إلى محفظتك.<br>ستُضاف <b>${num(r.coins)}</b> عملة إلى <b>${esc(r.name||'المستخدم')}</b>.`,'اعتماد وإضافة العملات'))return}
else{const v=await dlg({title:'رفض الطلب',icon:'x',danger:true,ok:'رفض الطلب',text:'اكتب سببًا اختياريًا يصل للمستخدم في إشعار.',fields:[{k:'note',ph:'سبب الرفض (اختياري)'}]});if(!v)return;note=v.note||''}
await once(async()=>{const{error}=await sb.rpc(ok?'approve_order':'reject_order',{p_order:r.id});

const uid=r.user_id||r.user||r.uid;let pushed=false;

async function adjust(sign){const u=S.sub;if(S.act)return;
const v=await dlg({title:sign>0?'إضافة عملات':'خصم عملات',icon:'coin',danger:sign<0,ok:sign>0?'إضافة':'خصم',text:`الحساب: <b>${esc(u.p.name)}</b>`,fields:[{k:'amt',ph:'عدد العملات',type:'number'},{k:'why',ph:'السبب (مطلوب)'}]});if(!v)return;
const n=Math.floor(Number(v.amt));if(!(n>0))return toast('أدخل عددًا صحيحًا أكبر من صفر');if(!v.why)return toast('اكتب السبب');
await once(async()=>{const{data,error}=await sb.rpc('admin_adjust_coins',{p_user:u.p.id,p_delta:sign*n,p_reason:v.why});

function vEd(){const e=S.sub,E=ED[e.t],r=e.row?E.get(e.row):{},F=edFields(e.t,e.row);
return`<div class="card">${F.map(f=>`<label class="lbl">${f[1]}</label><input class="fld" id="e-${f[0]}" type="${f[2]||'text'}" ${f[2]=='number'?'inputmode="decimal" min="0" step="any"':''} ${f[3]=='ltr'?'dir="ltr"':''} value="${esc(r[f[0]]!=null?r[f[0]]:(f[0]=='currency'?'USD':''))}"${e.t=='ac'&&e.row&&f[0]=='method'?' readonly':''}>`).join('')}
${E.act?`<label class="chk"><input type="checkbox" id="e-active"${e.row?(e.row.active?' checked':''):' checked'}>مفعّل</label>`:''}
<div class="acts"><button class="btn gr" data-a="ed-save">${ic('check',20)}حفظ</button>${e.row&&e.t!='rm'?`<button class="btn gh dn" data-a="ed-del">${ic('trash',20)}حذف</button>`:''}</div></div>`}
const edKey=(t,row)=>t=='ac'&&!('id'in row)?'method':'id';
async function edSave(){const e=S.sub,E=ED[e.t];if(S.act)return;const v={};edFields(e.t,e.row).forEach(f=>v[f[0]]=((($('#e-'+f[0])||{}).value)||'').trim());
const row=E.put(v);if(typeof row=='string')return toast(row);if(E.act)row.active=!!($('#e-active')||{}).checked;
await once(async()=>{let r;if(e.row){const k=edKey(e.t,e.row);r=await sb.from(E.tb).update(row).eq(k,e.row[k]).select()}else r=await sb.from(E.tb).insert(row).select();
if(r.error||!(r.data||[]).length)return toast(r.error&&r.error.code=='23505'?'هذا المعرّف موجود من قبل':'تعذر الحفظ: تأكد من تشغيل ملف SQL');
logAct(E.sv,e.row?e.row[edKey(e.t,e.row)]:(r.data[0]||{}).id,row);toast('تم الحفظ');S.sub=null;load()})}
async function edDel(){const e=S.sub,E=ED[e.t];if(S.act||!e.row||!await ask('حذف نهائي','سيُحذف هذا العنصر ولا يمكن التراجع.','حذف',true))return;const k=edKey(e.t,e.row);
await once(async()=>{const{data,error}=await sb.from(E.tb).delete().eq(k,e.row[k]).select();
if(error)return toast(error.code=='23503'?'لا يمكن الحذف لوجود بيانات مرتبطة. أوقفه بدلًا من ذلك':'تعذر الحذف');if(!(data||[]).length)return toast('تعذر الحذف');
logAct(E.dl,e.row[k]);toast('تم الحذف');S.sub=null;load()})}
async function cfgToggle(t,i){const row=S.cfg[t][i];if(!row||S.act)return;const k=edKey(t=='pk'?'pk':'ac',row),tb=t=='pk'?'coin_packages':'pay_accounts';
await once(async()=>{const{data,error}=await sb.from(tb).update({active:!row.active}).eq(k,row[k]).select();if(error||!(data||[]).length)return toast('تعذر التحديث');toast(row.active?'تم الإيقاف':'تم التفعيل');await loadCfg().catch(()=>{});render()})}
async function loadCfg(){const[p,a]=await Promise.all([sb.from('coin_packages').select('*').order('coins'),sb.from('pay_accounts').select('*')]);if(p.error||a.error)throw(p.error||a.error);S.cfg={pk:p.data||[],ac:a.data||[]}}

/* ---------- المديرون والسجل والتشخيص ---------- */
function vAdmins(){return`<div class="card"><b>إضافة مدير</b><input class="fld" id="aq" placeholder="ابحث باسم الحساب" value="${esc(S.aq)}" autocomplete="off"><div id="ares">${ares()}</div></div><div class="sec"><span>المديرون الحاليون (${S.admins.length})</span></div>${S.admins.map(a=>item(av(a),esc(a.name||'—'),a.user_id==S.user.id?'أنت':'',a.user_id==S.user.id?'':`<button class="btn sm gh dn" data-a="adm-rm" data-id="${esc(a.user_id)}" data-n="${esc(a.name||'')}">إزالة</button>`)).join('')}`}
function ares(){return S.ares.length?S.ares.map((p,i)=>item(av(p),esc(p.name),esc(p.city||''),`<button class="btn sm" data-a="adm-add" data-i="${i}">إضافة</button>`)).join(''):(S.aq.trim().length>=2?'<div class="empty" style="padding:14px">لا نتائج</div>':'')}
async function loadAdmins(){const r=await sb.rpc('admin_list_admins');if(r.error)throw r.error;S.admins=r.data||[]}
function vLog(){return S.logs.length?S.logs.map(l=>item(chip('doc','#64748B'),esc(ACT[l.action]||l.action),`${esc(l.who||'—')}${l.target?' · '+esc(String(l.target).slice(0,30)):''} · منذ ${ago(l.created_at)}`,'')).join(''):empty('لا توجد عمليات مسجّلة','doc')}
async function loadLog(){const r=await sb.from('admin_log').select('*').order('id',{ascending:false}).limit(100);if(r.error)throw r.error;S.logs=r.data||[];
const ids=[...new Set(S.logs.map(x=>x.admin_id).filter(Boolean))];if(ids.length){const{data}=await sb.from('profiles').select('id,name').in('id',ids),m={};(data||[]).forEach(x=>m[x.id]=x.name);S.logs.forEach(l=>l.who=m[l.admin_id])}}
function vDiag(){const d=S.diag||{},row=(l,v,h)=>`<div class="kv"><span>${l}</span><b>${v?pill(String(v===true?'جاهز':v),'ok'):pill('غير موجود','bad')}</b></div>${!v&&h?`<small style="color:var(--m);display:block;margin-bottom:6px">${h}</small>`:''}`;
return`${S.diagErr?`<div class="warn">تعذر التشخيص: ${esc(S.diagErr)}<br>شغّل ملف admin-setup.sql أولًا.</div>`:''}<div class="card"><b>حالة النظام</b>${row('جدول المحافظ',d.wallet_table,'مطلوب لعرض الرصيد وتعديله')}${row('جدول طلبات الشحن',d.orders_table,'مطلوب للأرشيف والإحصائيات')}${row('جدول اشتراكات الإشعارات',d.push_table,'مطلوب لإرسال الإشعارات')}${row('نظام الحظر',d.banned,'شغّل ملف SQL')}${row('سجل العمليات',d.log,'شغّل ملف SQL')}${row('سجل الإشعارات',d.announcements,'شغّل ملف SQL')}</div>
<div class="card"><b>اختبار الإشعارات</b><p style="color:var(--m);margin-top:6px">يرسل إشعارًا تجريبيًا إلى حسابك. فعّل الإشعارات خارج التطبيق من جوالك أولًا.</p><div class="acts"><button class="btn" data-a="diag-push">${ic('send',20)}إرسال إشعار تجريبي لي</button></div></div>`}

/* ---------- التحميل ---------- */
async function refreshCnt(){try{const[o,r,q]=await Promise.all([sb.rpc('admin_orders'),sb.from('reports').select('id',{count:'exact',head:true}).eq('handled',false),sb.from('model_requests').select('id',{count:'exact',head:true}).eq('status','pending')]);S.cnt={pay:(o.data||[]).length,rep:r.count||0,reqs:q.count||0};renderNav()}catch(e){}}
async function load(){S.busy=true;S.sub=null;S.more=false;render();const p=S.page;
try{if(p=='home'){const r=await sb.rpc('admin_stats');S.stErr=r.error?msg(r.error):null;S.st=r.data||null}
else if(p=='pay')await loadPay();else if(p=='users')await loadUsers();else if(p=='ntf')await loadHist();else if(p=='reqs')await loadReqs();else if(p=='models')await loadModels();
else if(p=='live')await loadLive();else if(p=='rep')await loadRep();else if(p=='cfg')await loadCfg();else if(p=='admins')await loadAdmins();else if(p=='log')await loadLog();
else if(p=='gifts'){const r=await sb.from('gift_catalog').select('*').order('price');if(r.error)throw r.error;S.gifts=r.data||[]}
else if(p=='rooms'){const r=await sb.from('rooms').select('*').order('id');if(r.error)throw r.error;S.rooms=r.data||[]}
else if(p=='diag'){const r=await sb.rpc('admin_diagnose');S.diagErr=r.error?msg(r.error):null;S.diag=r.data||null}}
catch(e){toast('تعذر التحميل: '+msg(e))}
S.busy=false;S.ubusy=false;render();if(p!='pay'&&p!='reqs'&&p!='rep')refreshCnt();else renderNav()}
async function boot(){const{data:{session}}=await sb.auth.getSession();
if(!session){S.user=null;S.busy=false;return render()}
S.user=session.user;const{data}=await sb.from('admins').select('user_id').eq('user_id',S.user.id).maybeSingle();S.admin=!!data;
if(S.admin)return load();S.busy=false;render()}

/* ---------- الأحداث ---------- */
document.addEventListener('input',e=>{const t=e.target,f=S.nf;
if(t.id=='nt-t'){f.title=t.value;const p=$('#pv-t');if(p)p.textContent=t.value||'عنوان الإشعار'}
else if(t.id=='nt-b'){f.body=t.value;const p=$('#pv-b');if(p)p.textContent=t.value||'هكذا سيظهر الإشعار على جهاز المستخدم'}
else if(t.id=='nt-q'){f.q=t.value;clearTimeout(qt);qt=setTimeout(async()=>{const r=await findProfiles(f.q);if(f.q!==t.value&&f.q!==$('#nt-q').value)return;f.res=r;const e=$('#ures');if(e)e.innerHTML=resHtml()},300)}
else if(t.id=='uq'){S.uq=t.value;clearTimeout(qt);qt=setTimeout(async()=>{S.ubusy=true;const e=$('#ulist');if(e)e.innerHTML=ulist();try{await loadUsers()}catch(x){toast('تعذر البحث')}S.ubusy=false;const l=$('#ulist');if(l)l.innerHTML=ulist()},350)}
else if(t.id=='aq'){S.aq=t.value;clearTimeout(qt);qt=setTimeout(async()=>{S.ares=await findProfiles(S.aq);const e=$('#ares');if(e)e.innerHTML=ares()},300)}});
document.addEventListener('change',e=>{if(e.target.id=='nt-a'){S.nf.aud=e.target.value;S.nf.user=null;S.nf.q='';S.nf.res=[];render()}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const d=b.dataset;
switch(d.a){
case'md-ok':{const v={};document.querySelectorAll('#md [data-f]').forEach(i=>v[i.dataset.f]=i.value.trim());dlgClose(v);break}
case'md-no':dlgClose(null);break;
case'google':await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});break;
case'login':{const{error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(error)return toast('بيانات الدخول غير صحيحة');boot();break}
case'out':await sb.auth.signOut();S=fresh();S.busy=false;render();break;
case'go':S.page=d.k;load();break;
case'more':S.more=true;render();break;
case'more-x':S.more=false;render();break;
case'refresh':S.sub?render():load();break;
case'back':S.sub=null;render();break;
case'ptab':S.ptab=d.t;load();break;
case'popen':S.sub={k:'order',row:S.list[+d.i]};render();break;
case'aopen':{const r=S.arch[+d.i];S.sub={k:'arch',row:r,url:null,urlLoading:!!r.receipt_path};render();if(r.receipt_path){const{data}=await sb.storage.from('receipts').createSignedUrl(r.receipt_path,600);if(S.sub&&S.sub.row===r){S.sub.url=data&&data.signedUrl;S.sub.urlLoading=false;render()}}break}
case'pyes':payDecide(true);break;case'pno':payDecide(false);break;
case'uopen':openUser(S.users[+d.i].id,S.users[+d.i]);break;
case'u-add':adjust(1);break;case'u-sub':adjust(-1);break;
case'u-ntf':S.nf.aud='user';S.nf.user=S.sub.p;S.nf.q='';S.nf.res=[];S.page='ntf';load();break;
case'u-ban':banUser(S.sub.p.id,S.sub.p.name);break;case'u-unban':unbanUser();break;case'u-del':delUser();break;
case'ntf-send':ntfSend();break;
case'ntf-pick':S.nf.user=S.nf.res[+d.i];S.nf.res=[];S.nf.q='';render();break;
case'ntf-clear':S.nf.user=null;render();break;
case'ropen':{S.sub={k:'req',row:S.list[+d.i],img:null};render();const{data}=await sb.storage.from('verify').createSignedUrl(S.sub.row.id_path,300);if(S.sub&&S.sub.k=='req'){S.sub.img=data&&data.signedUrl;render();if(!S.sub.img)toast('تعذر فتح صورة الهوية')}break}
case'ryes':reqDecide(true);break;case'rno':reqDecide(false);break;
case'endlive':endLive(d.id);break;
case'revoke':revoke(d.id);break;
case'handled':{const{error}=await sb.from('reports').update({handled:true}).eq('id',d.id);if(error)return toast('تعذر الحفظ');load();break}
case'rep-user':openUser(d.id);break;
case'rep-ban':{const o=S.nm['u:'+d.id]||{};banUser(d.id,o.name||'الحساب');break}
case'rep-msgs':showMsgs(d.id);break;
case'rep-room':delRoom(d.id,(S.nm['r:'+d.id]||{}).name);break;
case'room-del':delRoom(d.id,d.n);break;
case'ed-new':S.sub={k:'ed',t:d.t,row:null};render();break;
case'ed-edit':S.sub={k:'ed',t:d.t,row:(d.t=='gf'?S.gifts:S.cfg[d.t])[+d.i]};render();break;
case'ed-save':edSave();break;case'ed-del':edDel();break;
case'cfg-tog':cfgToggle(d.t,+d.i);break;
case'adm-add':{const p=S.ares[+d.i];if(!p||!await ask('إضافة مدير',`سيحصل <b>${esc(p.name)}</b> على صلاحيات الإدارة الكاملة.`,'إضافة مدير'))break;
const{error}=await sb.rpc('admin_set_admin',{p_user:p.id,p_on:true});if(error)return toast('تعذر التنفيذ: '+msg(error));toast('تمت الإضافة');S.aq='';S.ares=[];load();break}
case'adm-rm':{if(!await ask('إزالة مدير',`إزالة صلاحيات <b>${esc(d.n)}</b>؟`,'إزالة',true))break;const{error}=await sb.rpc('admin_set_admin',{p_user:d.id,p_on:false});if(error)return toast('تعذر التنفيذ: '+msg(error));toast('تمت الإزالة');load();break}
case'diag-push':{const r=await sendPush({audience:'user',user_id:S.user.id,title:'اختبار الإشعارات',body:'إذا وصلك هذا الإشعار فكل شيء يعمل'});toast(r.ok?(r.total?`أُرسل إلى ${r.sent} جهاز`:'الدالة تعمل، لكن لا توجد أجهزة مفعّلة لحسابك'):'تعذر الإرسال: '+r.err);break}
}});
boot();
</script>
</body>
</html>
