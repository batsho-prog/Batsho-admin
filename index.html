<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7C3AED">
<meta name="robots" content="noindex">
<title>إدارة Batsho</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--p:#7C3AED;--k:#22B8F5;--bg:#F8F7FF;--c:#fff;--t:#1F2937;--m:#6B7280;--l:#EDE9FE}
@media(prefers-color-scheme:dark){:root{--bg:#14121f;--c:#1e1b30;--t:#f3f4f6;--m:#9CA3AF;--l:#2e2850}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}body{font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--t);font-size:15px}
#app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:auto;padding-top:env(safe-area-inset-top,0px)}
button,input,textarea,select{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
header{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}h1{font-size:21px;font-weight:800;flex:1}
main{flex:1;overflow-y:auto;padding:4px 14px 16px}
nav{display:flex;overflow-x:auto;background:var(--c);border-top:1px solid var(--l);padding-bottom:env(safe-area-inset-bottom,0px);scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;min-width:70px;padding:9px 6px 7px;font-size:11px;color:var(--m);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;white-space:nowrap}nav i{font-style:normal;font-size:20px}nav .on{color:var(--p);font-weight:700}
.bdg{position:absolute;top:4px;inset-inline-end:10px;min-width:17px;height:17px;border-radius:9px;background:#DC2626;color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}.bdg[hidden]{display:none}
.row{display:flex;align-items:center;gap:12px;background:var(--c);border-radius:16px;padding:12px;margin-bottom:10px;width:100%;text-align:start}
.tx{flex:1;min-width:0}.tx b{display:block}.tx small{color:var(--m);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:46px;height:46px;border-radius:50%;object-fit:cover;display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;flex:none;background:var(--p)}
.btn{background:linear-gradient(135deg,var(--k),var(--p));color:#fff;border-radius:12px;padding:10px 16px;font-weight:700}.btn[disabled]{opacity:.5;pointer-events:none}.sm{padding:7px 12px;font-size:13px}
.red{background:#DC2626}.gr{background:#16A34A}.gh{background:var(--l);color:var(--p)}
.empty{text-align:center;color:var(--m);padding:60px 20px}.warn{background:#FEF3C7;color:#92400E;border-radius:12px;padding:10px;font-size:13px;margin-bottom:10px}
.box{background:var(--c);border-radius:16px;padding:14px;margin-bottom:12px}.box img.big{width:100%;border-radius:12px;margin-top:8px;background:#000}
.fld,.box textarea,.login input{width:100%;background:var(--bg);border:1px solid var(--l);border-radius:12px;padding:12px;cursor:text;margin-top:8px;display:block}
select.fld{cursor:pointer}
.lbl{display:block;margin-top:12px;font-size:13px;color:var(--m)}
.acts{display:flex;gap:8px;margin-top:10px}.acts button{flex:1}
.sec{font-weight:800;margin:14px 2px 8px;display:flex;align-items:center;gap:8px}.sec span{flex:1}
.pill{display:inline-block;border-radius:9px;padding:2px 8px;font-size:12px;background:var(--l);color:var(--p)}.pill.off{background:#FEE2E2;color:#B91C1C}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px}.chk input{width:20px;height:20px;margin:0;cursor:pointer}
.login{margin:auto;padding:26px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:center}.login img{width:84px;border-radius:22px;margin:auto}
.g{background:#fff;color:#1F2937;border:1px solid var(--l)}
#tt{position:fixed;bottom:90px;inset-inline:0;margin:auto;width:max-content;max-width:86%;background:#111827;color:#fff;padding:10px 18px;border-radius:22px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}#tt.on{opacity:1}
</style>
</head>
<body>
<div id="app"></div><div id="tt"></div>
<script>
const SB_URL='https://whjyruxlcxgwivyuntub.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndoanlydXhsY3hnd2l2eXVudHViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzODY3NDIsImV4cCI6MjEwODk2Mjc0Mn0.5Mb3qEyfQ5bIFwOl6YvltfSPjdpuKYtya9ENtkbD-6k';
const sb=supabase.createClient(SB_URL,SB_KEY);
const PUSH_FN='admin-push'; // اسم دالة Edge Function لإرسال الإشعارات
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const msg=e=>String((e&&(e.message||e.error_description))||e||'').slice(0,90);
const money=(c,cur)=>(Number(c||0)/100).toFixed(2)+' '+esc(cur||'');
const TT={pay:'طلبات الشحن',ntf:'الإشعارات',req:'طلبات الموديلز',live:'البثوث الآن',rep:'البلاغات',mod:'الموديلز',cfg:'الإعدادات'},
IC={pay:'💰',ntf:'🔔',req:'📝',live:'🔴',rep:'⚑',mod:'🎥',cfg:'⚙️'};
const AUD={all:'كل الحسابات',models:'الموديلز فقط',user:'حساب محدد'};
const fresh=()=>({user:null,admin:false,tab:'pay',list:[],sel:null,img:null,nm:{},busy:true,pend:0,act:false,hist:[],cfg:{pk:[],ac:[]},ed:null,
 nf:{aud:'all',user:null,q:'',res:[],title:'',body:'',sending:false}});
let S=fresh();
function toast(t){const e=$('#tt');e.textContent=t;e.className='on';clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',2800)}
const av=p=>p&&p.avatar_url?`<img class="av" src="${esc(p.avatar_url)}" alt="">`:`<span class="av">${esc(((p&&p.name)||'؟')[0])}</span>`;
const age=d=>Math.floor((Date.now()-new Date(d))/31557600000);
const ago=d=>{if(!d)return'';const m=Math.max(0,Math.round((Date.now()-new Date(d))/60000));return m<60?m+' د':m<1440?Math.round(m/60)+' س':Math.round(m/1440)+' يوم'};

/* ---------- العروض ---------- */
function login(){return`<div class="login"><img src="icon-192.png" alt=""><h1 style="flex:none">إدارة Batsho</h1><button class="btn g" data-a="google"><b style="color:#4285F4">G</b> الدخول عبر Google</button><input type="email" id="em" placeholder="البريد" dir="ltr"><input type="password" id="pw" placeholder="كلمة المرور" dir="ltr"><button class="btn" data-a="login">دخول بالبريد</button></div>`}

function listHtml(){const t=S.tab,L=S.list;if(S.busy)return'<div class="empty">جارٍ التحميل…</div>';if(!L.length)return'<div class="empty">لا يوجد شيء حاليًا ✅</div>';
if(t=='pay')return L.map((r,i)=>`<button class="row" data-a="popen" data-i="${i}"><span class="av">💰</span><div class="tx"><b>${esc(r.name||'مستخدم')}</b><small>${esc(r.coins)} عملة · ${money(r.amount_cents,r.currency)}${r.created_at?' · منذ '+ago(r.created_at):''}</small></div>›</button>`).join('');
if(t=='req')return L.map((r,i)=>`<button class="row" data-a="open" data-i="${i}">${av(r.profiles)}<div class="tx"><b>${esc((r.profiles||{}).name)}</b><small>ميلاد ${esc(r.birth_date)} (عمر ${age(r.birth_date)}) · منذ ${ago(r.created_at)}</small></div>›</button>`).join('');
if(t=='live')return L.map(l=>`<div class="row"><div class="tx"><b>${esc(l.title)}</b><small>${esc((l.profiles||{}).name)} · منذ ${ago(l.started_at)}</small></div><button class="btn sm red" data-a="endlive" data-id="${esc(l.id)}">إنهاء</button></div>`).join('');
if(t=='rep')return L.map(r=>{const k=r.target,nm=S.nm[k]||k,ty=k[0]=='u'?'مستخدم':k[0]=='r'?'غرفة':'بث';return`<div class="box"><b>${ty}: ${esc(nm)}</b><small style="display:block;color:var(--m)">بلاغ من ${esc(S.nm['u:'+r.reporter]||'؟')} · منذ ${ago(r.created_at)}</small><div class="acts">${k[0]=='l'?`<button class="btn sm red" data-a="endlive" data-id="${esc(k.slice(2))}">إنهاء البث</button>`:''}<button class="btn sm gr" data-a="handled" data-id="${esc(r.id)}">تمت المعالجة</button></div></div>`}).join('');
return L.map(m=>`<div class="row">${av(m.profiles)}<div class="tx"><b>${esc((m.profiles||{}).name)}</b><small>معتمدة منذ ${ago(m.approved_at)}</small></div><button class="btn sm red" data-a="revoke" data-id="${esc(m.user_id)}">إلغاء</button></div>`).join('')}

function detail(){const r=S.sel,p=r.profiles||{};return`<header><button class="btn sm gh" data-a="back">➜ رجوع</button><h1>${esc(p.name)}</h1></header><main><div class="box"><div style="display:flex;gap:12px;align-items:center">${av(p)}<div><b>${esc(p.name)}</b><small style="display:block;color:var(--m)">${esc(p.city||'')}</small></div></div><p style="margin-top:10px">تاريخ الميلاد: <b>${esc(r.birth_date)}</b> (العمر ${age(r.birth_date)})</p></div><div class="box"><b>صورة الهوية</b>${S.img?`<img class="big" src="${esc(S.img)}" alt="">`:'<div class="empty" style="padding:30px">جارٍ التحميل…</div>'}</div><div class="box"><b>الصورة الشخصية</b>${p.avatar_url?`<img class="big" src="${esc(p.avatar_url)}" alt="">`:'<div class="warn">لا توجد صورة شخصية</div>'}</div><div class="box"><b>ملاحظة (إلزامية عند الرفض)</b><textarea id="nt" rows="2" maxlength="200" placeholder="سبب الرفض يظهر للمستخدمة"></textarea><div class="acts"><button class="btn gr" data-a="yes">موافقة</button><button class="btn red" data-a="no">رفض</button></div><small style="display:block;color:var(--m);margin-top:8px">تُحذف صورة الهوية تلقائيًا بعد القرار.</small></div></main>`}

/* ---- تفاصيل طلب شحن ---- */
function payDetail(){const r=S.sel,uid=r.user_id||r.user||r.uid;
return`<header><button class="btn sm gh" data-a="back">➜ رجوع</button><h1>${esc(r.name||'طلب شحن')}</h1></header><main>
<div class="box"><b>${esc(r.coins)} عملة</b><div style="color:var(--m);line-height:2;margin-top:6px">المبلغ: <b style="color:var(--t)">${money(r.amount_cents,r.currency)}</b>${r.price_yer?' · '+esc(r.price_yer)+' ر.ي':''}<br>رقم العملية: <b style="color:var(--t);user-select:all">${esc(r.ref)}</b>${r.method?'<br>طريقة الدفع: '+esc(r.method):''}${r.created_at?'<br>منذ '+ago(r.created_at):''}</div></div>
<div class="box"><b>صورة الإيصال</b>${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener"><img class="big" src="${esc(r.url)}" alt=""></a>`:'<div class="warn" style="margin-top:8px">لا توجد صورة إيصال</div>'}<small style="display:block;color:var(--m);margin-top:8px">الرابط مؤقت (15 دقيقة). حدّث القائمة إذا انتهى.</small></div>
<div class="box"><b>الإجراء</b>${uid?'':'<div class="warn" style="margin-top:8px">لن يصل إشعار للمستخدم لأن الطلب لا يحمل معرّف الحساب (راجع ADMIN-SETUP.md).</div>'}<textarea id="pnt" rows="2" maxlength="120" placeholder="سبب الرفض (اختياري) يظهر في إشعار المستخدم"></textarea><div class="acts"><button class="btn gr" data-a="pyes"${S.act?' disabled':''}>اعتماد وإضافة العملات</button><button class="btn red" data-a="pno"${S.act?' disabled':''}>رفض</button></div></div></main>`}

/* ---- الإشعارات ---- */
function ntfHtml(){const f=S.nf;
const pick=f.aud=='user'?`<label class="lbl">الحساب</label>${f.user?`<div class="row" style="margin:8px 0 0">${av(f.user)}<div class="tx"><b>${esc(f.user.name)}</b><small>${esc(f.user.city||'')}</small></div><button class="btn sm gh" data-a="ntf-clear">تغيير</button></div>`:`<input class="fld" id="nt-q" placeholder="ابحث باسم الحساب" value="${esc(f.q)}" autocomplete="off"><div id="ures">${resHtml()}</div>`}`:'';
return`<div class="box"><b>إشعار جديد</b>
<label class="lbl">المستلمون</label><select class="fld" id="nt-a">${Object.keys(AUD).map(k=>`<option value="${k}"${k==f.aud?' selected':''}>${AUD[k]}</option>`).join('')}</select>${pick}
<label class="lbl">العنوان</label><input class="fld" id="nt-t" maxlength="50" placeholder="عنوان قصير" value="${esc(f.title)}">
<label class="lbl">النص</label><textarea class="fld" id="nt-b" rows="3" maxlength="160" placeholder="نص الإشعار">${esc(f.body)}</textarea>
<div class="acts"><button class="btn" data-a="ntf-send" id="nt-s"${f.sending?' disabled':''}>إرسال الإشعار</button></div>
<small style="display:block;color:var(--m);margin-top:8px">يصل للأجهزة التي فعّلت الإشعارات خارج التطبيق، ويُحفظ في السجل.</small></div>
<div class="sec"><span>آخر الإشعارات</span></div>${S.busy?'<div class="empty">جارٍ التحميل…</div>':S.hist.length?S.hist.map(h=>`<div class="box"><b>${esc(h.title)}</b><div style="margin-top:4px">${esc(h.body)}</div><small style="display:block;color:var(--m);margin-top:6px">${AUD[h.audience]||''} · منذ ${ago(h.created_at)}</small></div>`).join(''):'<div class="empty" style="padding:30px">لا توجد إشعارات سابقة</div>'}`}
function resHtml(){const r=S.nf.res;return r.length?r.map((p,i)=>`<button class="row" style="margin:8px 0 0" data-a="ntf-pick" data-i="${i}">${av(p)}<div class="tx"><b>${esc(p.name)}</b><small>${esc(p.city||'')}</small></div></button>`).join(''):(S.nf.q.trim().length>=2?'<div class="empty" style="padding:16px">لا نتائج</div>':'')}

/* ---- الإعدادات: الباقات وحسابات الدفع ---- */
function cfgHtml(){if(S.busy)return'<div class="empty">جارٍ التحميل…</div>';const C=S.cfg;
const pk=C.pk.length?C.pk.map((k,i)=>`<div class="row"><div class="tx"><b>${esc(k.coins)} عملة</b><small>${money(k.price_cents,k.currency)}${k.price_yer?' · '+esc(k.price_yer)+' ر.ي':''}${k.label?' · '+esc(k.label):''}</small></div><span class="pill${k.active?'':' off'}">${k.active?'مفعّلة':'موقوفة'}</span><button class="btn sm gh" data-a="cfg-tog" data-t="pk" data-i="${i}">${k.active?'إيقاف':'تفعيل'}</button><button class="btn sm gh" data-a="cfg-edit" data-t="pk" data-i="${i}">تعديل</button></div>`).join(''):'<div class="empty" style="padding:20px">لا توجد باقات</div>';
const ac=C.ac.length?C.ac.map((k,i)=>`<div class="row"><div class="tx"><b>${esc(k.label)}</b><small>${esc(k.number)} · ${esc(k.holder)}</small></div><span class="pill${k.active?'':' off'}">${k.active?'مفعّل':'موقوف'}</span><button class="btn sm gh" data-a="cfg-tog" data-t="ac" data-i="${i}">${k.active?'إيقاف':'تفعيل'}</button><button class="btn sm gh" data-a="cfg-edit" data-t="ac" data-i="${i}">تعديل</button></div>`).join(''):'<div class="empty" style="padding:20px">لا توجد حسابات دفع</div>';
return`<div class="sec"><span>باقات العملات</span><button class="btn sm" data-a="cfg-new" data-t="pk">+ باقة</button></div>${pk}<div class="sec"><span>حسابات استلام الأموال</span><button class="btn sm" data-a="cfg-new" data-t="ac">+ حساب</button></div>${ac}<div class="warn">الحسابات الموقوفة والباقات الموقوفة لا تظهر للمستخدمين في شاشة الشحن.</div>`}
function edView(){const e=S.ed,r=e.row||{},pk=e.t=='pk';
return`<header><button class="btn sm gh" data-a="cfg-back">➜ رجوع</button><h1>${e.row?'تعديل':'إضافة'} ${pk?'باقة':'حساب دفع'}</h1></header><main><div class="box">${pk?
`<label class="lbl">عدد العملات</label><input class="fld" id="e-coins" type="number" inputmode="numeric" min="1" value="${esc(r.coins||'')}">
<label class="lbl">السعر (بوحدة العملة، مثل 4.99)</label><input class="fld" id="e-price" type="number" inputmode="decimal" min="0" step="0.01" value="${r.price_cents!=null?esc((r.price_cents/100).toFixed(2)):''}">
<label class="lbl">العملة</label><input class="fld" id="e-cur" maxlength="5" dir="ltr" value="${esc(r.currency||'USD')}">
<label class="lbl">السعر بالريال اليمني (اختياري)</label><input class="fld" id="e-yer" type="number" inputmode="numeric" min="0" value="${esc(r.price_yer||'')}">
<label class="lbl">وسم (اختياري، مثل: الأكثر طلبًا)</label><input class="fld" id="e-label" maxlength="20" value="${esc(r.label||'')}">`:
`<label class="lbl">المعرّف (إنجليزي بدون مسافات، مثل kuraimi)</label><input class="fld" id="e-method" maxlength="30" dir="ltr" value="${esc(r.method||'')}"${e.row?' readonly':''}>
<label class="lbl">الاسم الظاهر</label><input class="fld" id="e-label" maxlength="40" value="${esc(r.label||'')}">
<label class="lbl">رقم الحساب / المحفظة</label><input class="fld" id="e-number" maxlength="60" dir="ltr" value="${esc(r.number||'')}">
<label class="lbl">اسم صاحب الحساب</label><input class="fld" id="e-holder" maxlength="60" value="${esc(r.holder||'')}">`}
<label class="chk"><input type="checkbox" id="e-active"${e.row?(r.active?' checked':''):' checked'}> مفعّل</label>
<div class="acts"><button class="btn gr" data-a="cfg-save"${S.act?' disabled':''}>حفظ</button>${e.row?'<button class="btn red" data-a="cfg-del">حذف</button>':''}</div></div></main>`}

function body(){return S.tab=='ntf'?ntfHtml():S.tab=='cfg'?cfgHtml():listHtml()}
function render(){const a=$('#app');
if(S.busy&&!S.user){a.innerHTML='<div class="empty" style="margin:auto">…</div>';return}
if(!S.user){a.innerHTML=login();return}
if(!S.admin){a.innerHTML='<div class="login"><h1 style="flex:none">لا توجد صلاحية</h1><p style="color:var(--m)">هذا الحساب غير مسجّل كمدير.</p><button class="btn" data-a="out">تسجيل الخروج</button></div>';return}
if(S.ed){a.innerHTML=edView();return}
if(S.sel){a.innerHTML=S.tab=='pay'?payDetail():detail();return}
const cnt=!S.busy&&!['ntf','cfg'].includes(S.tab)?' ('+S.list.length+')':'';
a.innerHTML=`<header><h1>${TT[S.tab]}${cnt}</h1><button class="btn sm gh" data-a="refresh">↻</button><button class="btn sm gh" data-a="out">خروج</button></header><main>${body()}</main><nav>${Object.keys(TT).map(t=>`<button class="${t==S.tab?'on':''}" data-a="tab" data-t="${t}"><i>${IC[t]}</i>${TT[t]}${t=='pay'?`<span class="bdg" id="bd-pay"${S.pend?'':' hidden'}>${S.pend}</span>`:''}</button>`).join('')}</nav>`}
function setBadge(){const b=$('#bd-pay');if(b){b.textContent=S.pend;b.hidden=!S.pend}}

/* ---------- التحميل ---------- */
async function loadPay(){const r=await sb.rpc('admin_orders');if(r.error)throw r.error;
const rows=r.data||[],paths=rows.map(x=>x.receipt_path).filter(Boolean);
if(paths.length){const{data:u}=await sb.storage.from('receipts').createSignedUrls(paths,900);(u||[]).forEach(x=>{const o=rows.find(y=>y.receipt_path==x.path);if(o)o.url=x.signedUrl})}
S.list=rows;S.pend=rows.length}
async function loadHist(){const r=await sb.from('announcements').select('id,title,body,audience,created_at').order('id',{ascending:false}).limit(30);if(r.error)throw r.error;S.hist=r.data||[]}
async function loadCfg(){const[p,a]=await Promise.all([sb.from('coin_packages').select('*').order('coins'),sb.from('pay_accounts').select('*')]);if(p.error||a.error)throw(p.error||a.error);S.cfg={pk:p.data||[],ac:a.data||[]}}
async function loadClassic(t){let r;
if(t=='req')r=await sb.from('model_requests').select('*').eq('status','pending').order('id');
else if(t=='live')r=await sb.from('lives').select('id,title,host,started_at').is('ended_at',null).order('id',{ascending:false});
else if(t=='rep')r=await sb.from('reports').select('*').eq('handled',false).order('id',{ascending:false}).limit(100);
else r=await sb.from('models').select('user_id,approved_at');
if(r.error)toast('تعذر التحميل: '+msg(r.error));S.list=r.data||[];
const key=t=='live'?'host':'user_id';if(t!='rep'&&S.list.length){const ids=[...new Set(S.list.map(x=>x[key]))],{data:ps}=await sb.from('profiles').select('id,name,avatar_url,city').in('id',ids),m={};(ps||[]).forEach(q=>m[q.id]=q);S.list.forEach(x=>x.profiles=m[x[key]]||null)}
if(t=='rep'){const u=new Set(),l=new Set();S.list.forEach(x=>{if(x.reporter)u.add(x.reporter);if(x.target.startsWith('u:'))u.add(x.target.slice(2));if(x.target.startsWith('l:'))l.add(x.target.slice(2))});
const[p,q]=await Promise.all([u.size?sb.from('profiles').select('id,name').in('id',[...u]):{data:[]},l.size?sb.from('lives').select('id,title').in('id',[...l]):{data:[]}]);
S.nm={};(p.data||[]).forEach(x=>S.nm['u:'+x.id]=x.name);(q.data||[]).forEach(x=>S.nm['l:'+x.id]=x.title)}}
async function load(){S.busy=true;S.sel=null;S.ed=null;S.img=null;render();const t=S.tab;
try{if(t=='pay')await loadPay();else if(t=='ntf')await loadHist();else if(t=='cfg')await loadCfg();else await loadClassic(t)}
catch(e){toast('تعذر التحميل: '+msg(e));if(t=='pay')S.list=[]}
S.busy=false;render()}
async function pendCount(){try{const{data}=await sb.rpc('admin_orders');S.pend=(data||[]).length;setBadge()}catch(e){}}
async function boot(){const{data:{session}}=await sb.auth.getSession();
if(!session){S.user=null;S.busy=false;return render()}
S.user=session.user;const{data}=await sb.from('admins').select('user_id').eq('user_id',S.user.id).maybeSingle();S.admin=!!data;
if(S.admin){load();return pendCount()}S.busy=false;render()}

/* ---------- إرسال الإشعارات (Edge Function) ---------- */
async function sendPush(p){try{const{data,error}=await sb.functions.invoke(PUSH_FN,{body:p});if(error)throw error;return{ok:true,...(data||{})}}
catch(e){let m=msg(e);try{if(e.context&&e.context.json){const j=await e.context.json();if(j&&j.error)m=String(j.error)}}catch(_){}return{ok:false,err:m}}}
async function ntfSend(){const f=S.nf;if(f.sending)return;
const title=f.title.trim(),text=f.body.trim();
if(!title||!text)return toast('اكتب العنوان والنص');
if(f.aud=='user'&&!f.user)return toast('اختر الحساب أولًا');
const who=f.aud=='user'?f.user.name:AUD[f.aud];
if(!confirm('إرسال هذا الإشعار إلى «'+who+'»؟'))return;
f.sending=true;const bt=$('#nt-s');if(bt)bt.disabled=true;
const p={audience:f.aud,title,body:text};if(f.aud=='user')p.user_id=f.user.id;
const r=await sendPush(p);f.sending=false;if(bt)bt.disabled=false;
if(!r.ok)return toast('تعذر الإرسال: '+r.err);
f.title='';f.body='';
toast(r.total?`أُرسل إلى ${r.sent} جهاز`+(r.failed?` (فشل ${r.failed})`:''):'حُفظ الإشعار، لكن لا توجد أجهزة مفعّلة حاليًا');
await loadHist().catch(()=>{});render()}
let qt=0;
async function searchUsers(){const q=S.nf.q.replace(/[%_,()]/g,' ').trim();
if(q.length<2){S.nf.res=[];const e=$('#ures');if(e)e.innerHTML=resHtml();return}
const{data}=await sb.from('profiles').select('id,name,avatar_url,city').ilike('name','%'+q+'%').limit(8);
if(S.nf.q.replace(/[%_,()]/g,' ').trim()!==q)return;S.nf.res=data||[];const e=$('#ures');if(e)e.innerHTML=resHtml()}

/* ---------- قرارات الشحن ---------- */
async function payDecide(ok){const r=S.sel;if(!r||S.act)return;
const note=(($('#pnt')||{}).value||'').trim();
if(ok&&!confirm('تأكد أن المبلغ وصل فعلًا إلى محفظتك.\nاعتماد الطلب وإضافة '+r.coins+' عملة لـ '+(r.name||'المستخدم')+'؟'))return;
if(!ok&&!confirm('رفض هذا الطلب؟'))return;
S.act=true;render();
const{error}=await sb.rpc(ok?'approve_order':'reject_order',{p_order:r.id});
S.act=false;
if(error){render();return toast('تعذر التنفيذ: '+msg(error))}
const uid=r.user_id||r.user||r.uid;let pushed=false;
if(uid){const n=await sendPush({audience:'user',user_id:uid,
 title:ok?'تمت إضافة عملاتك 💰':'تعذر قبول طلب الشحن',
 body:ok?`أُضيف ${r.coins} عملة إلى رصيدك. شكرًا لك!`:(note||'تم رفض طلب الشحن. تواصل معنا إن كان هناك خطأ.')});pushed=n.ok}
toast(ok?'تمت إضافة العملات ✅':'تم رفض الطلب');
if(uid&&!pushed)setTimeout(()=>toast('تم القرار، لكن تعذر إرسال الإشعار للمستخدم'),2900);
load()}

/* ---------- الإعدادات ---------- */
const cfgTable=t=>t=='pk'?'coin_packages':'pay_accounts';
const cfgKey=(t,row)=>t=='pk'||('id'in row)?'id':'method';
async function cfgSave(){const e=S.ed;if(!e||S.act)return;const v=id=>(($('#'+id)||{}).value||'').trim(),on=$('#e-active').checked;let row;
if(e.t=='pk'){const coins=parseInt(v('e-coins'),10),price=Math.round(parseFloat(v('e-price'))*100),yer=v('e-yer');
 if(!(coins>0))return toast('أدخل عدد العملات');if(!(price>=0))return toast('أدخل السعر');
 row={coins,price_cents:price,currency:(v('e-cur')||'USD').toUpperCase(),price_yer:yer?parseInt(yer,10):null,label:v('e-label')||null,active:on}}
else{const m=v('e-method');if(!/^[a-z0-9_-]{2,30}$/i.test(m))return toast('المعرّف: حروف إنجليزية وأرقام فقط');
 if(!v('e-label')||!v('e-number')||!v('e-holder'))return toast('أكمل كل الحقول');
 row={method:m,label:v('e-label'),number:v('e-number'),holder:v('e-holder'),active:on}}
S.act=true;
const tb=cfgTable(e.t);let r;
if(e.row){const k=cfgKey(e.t,e.row);r=await sb.from(tb).update(row).eq(k,e.row[k]).select()}else r=await sb.from(tb).insert(row).select();
S.act=false;
if(r.error||!(r.data||[]).length)return toast(r.error&&r.error.code=='23505'?'هذا المعرّف موجود من قبل':'تعذر الحفظ: تأكد من تشغيل ملف SQL');
toast('تم الحفظ');S.ed=null;await loadCfg().catch(()=>{});render()}
async function cfgToggle(t,i){const row=S.cfg[t][i];if(!row)return;const k=cfgKey(t,row);
const{data,error}=await sb.from(cfgTable(t)).update({active:!row.active}).eq(k,row[k]).select();
if(error||!(data||[]).length)return toast('تعذر التحديث');toast(row.active?'تم الإيقاف':'تم التفعيل');await loadCfg().catch(()=>{});render()}
async function cfgDelete(){const e=S.ed;if(!e||!e.row||!confirm('حذف هذا العنصر نهائيًا؟'))return;const k=cfgKey(e.t,e.row);
const{data,error}=await sb.from(cfgTable(e.t)).delete().eq(k,e.row[k]).select();
if(error)return toast(error.code=='23503'?'لا يمكن الحذف لوجود طلبات مرتبطة. أوقفه بدلًا من ذلك':'تعذر الحذف');
if(!(data||[]).length)return toast('تعذر الحذف');toast('تم الحذف');S.ed=null;await loadCfg().catch(()=>{});render()}

/* ---------- طلبات الموديلز ---------- */
async function decide(ok){const r=S.sel,note=$('#nt').value.trim();if(!ok&&!note)return toast('اكتب سبب الرفض');
if(!confirm(ok?'الموافقة على هذا الطلب؟':'رفض هذا الطلب؟'))return;
const{data,error}=await sb.from('model_requests').update({status:ok?'approved':'rejected',note:note||null}).eq('id',r.id).select();
if(error||!data.length)return toast('تعذر حفظ القرار');
await sb.storage.from('verify').remove([r.id_path]);toast(ok?'تمت الموافقة':'تم الرفض');load()}

/* ---------- الأحداث ---------- */
document.addEventListener('input',e=>{const t=e.target,f=S.nf;
if(t.id=='nt-t')f.title=t.value;else if(t.id=='nt-b')f.body=t.value;
else if(t.id=='nt-q'){f.q=t.value;clearTimeout(qt);qt=setTimeout(searchUsers,300)}});
document.addEventListener('change',e=>{if(e.target.id=='nt-a'){S.nf.aud=e.target.value;S.nf.user=null;S.nf.q='';S.nf.res=[];render()}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const d=b.dataset;
switch(d.a){
case'google':await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});break;
case'login':{const{error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(error)return toast('بيانات الدخول غير صحيحة');boot();break}
case'out':await sb.auth.signOut();S=fresh();S.busy=false;render();break;
case'tab':S.tab=d.t;load();break;
case'refresh':load();break;
case'open':{S.sel=S.list[+d.i];S.img=null;render();const{data}=await sb.storage.from('verify').createSignedUrl(S.sel.id_path,300);S.img=data&&data.signedUrl;if(S.sel)render();if(!S.img)toast('تعذر فتح صورة الهوية');break}
case'popen':S.sel=S.list[+d.i];render();break;
case'back':S.sel=null;render();setBadge();break;
case'yes':decide(true);break;
case'no':decide(false);break;
case'pyes':payDecide(true);break;
case'pno':payDecide(false);break;
case'ntf-send':ntfSend();break;
case'ntf-pick':S.nf.user=S.nf.res[+d.i];S.nf.res=[];S.nf.q='';render();break;
case'ntf-clear':S.nf.user=null;render();break;
case'cfg-new':S.ed={t:d.t,row:null};render();break;
case'cfg-edit':S.ed={t:d.t,row:S.cfg[d.t][+d.i]};render();break;
case'cfg-back':S.ed=null;render();break;
case'cfg-save':cfgSave();break;
case'cfg-del':cfgDelete();break;
case'cfg-tog':cfgToggle(d.t,+d.i);break;
case'endlive':{if(!confirm('إنهاء هذا البث؟'))return;const{data,error}=await sb.from('lives').update({ended_at:new Date().toISOString()}).eq('id',d.id).select();if(error||!data.length)return toast('تعذر الإنهاء');toast('تم إنهاء البث');load();break}
case'handled':{const{error}=await sb.from('reports').update({handled:true}).eq('id',d.id);if(error)return toast('تعذر الحفظ');load();break}
case'revoke':{if(!confirm('إلغاء صلاحية البث لهذه الموديلز؟'))return;await sb.from('models').delete().eq('user_id',d.id);await sb.from('lives').update({ended_at:new Date().toISOString()}).eq('host',d.id).is('ended_at',null);toast('تم الإلغاء');load();break}
}});
boot();
</script>
</body>
