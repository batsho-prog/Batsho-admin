<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7C3AED">
<meta name="robots" content="noindex">
<title>إدارة Batsho</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--p:#7C3AED;--k:#22B8F5;--bg:#F8F7FF;--c:#fff;--t:#1F2937;--m:#6B7280;--l:#EDE9FE}
@media(prefers-color-scheme:dark){:root{--bg:#14121f;--c:#1e1b30;--t:#f3f4f6;--m:#9CA3AF;--l:#2e2850}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}body{font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--t);font-size:15px}
#app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:auto;padding-top:env(safe-area-inset-top,0px)}
button,input,textarea{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
header{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}h1{font-size:21px;font-weight:800;flex:1}
main{flex:1;overflow-y:auto;padding:4px 14px 16px}
nav{display:flex;background:var(--c);border-top:1px solid var(--l);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:9px 0 7px;font-size:11px;color:var(--m);display:flex;flex-direction:column;align-items:center;gap:2px}nav i{font-style:normal;font-size:20px}nav .on{color:var(--p);font-weight:700}
.row{display:flex;align-items:center;gap:12px;background:var(--c);border-radius:16px;padding:12px;margin-bottom:10px;width:100%;text-align:start}
.tx{flex:1;min-width:0}.tx b{display:block}.tx small{color:var(--m);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:46px;height:46px;border-radius:50%;object-fit:cover;display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;flex:none;background:var(--p)}
.btn{background:linear-gradient(135deg,var(--k),var(--p));color:#fff;border-radius:12px;padding:10px 16px;font-weight:700}.sm{padding:7px 12px;font-size:13px}
.red{background:#DC2626}.gr{background:#16A34A}.gh{background:var(--l);color:var(--p)}
.empty{text-align:center;color:var(--m);padding:60px 20px}.warn{background:#FEF3C7;color:#92400E;border-radius:12px;padding:10px;font-size:13px;margin-bottom:10px}
.box{background:var(--c);border-radius:16px;padding:14px;margin-bottom:12px}.box img.big{width:100%;border-radius:12px;margin-top:8px;background:#000}
.box textarea,.login input{width:100%;background:var(--bg);border:1px solid var(--l);border-radius:12px;padding:12px;cursor:text;margin-top:8px}
.acts{display:flex;gap:8px;margin-top:10px}.acts button{flex:1}
.login{margin:auto;padding:26px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:center}.login img{width:84px;border-radius:22px;margin:auto}
.g{background:#fff;color:#1F2937;border:1px solid var(--l)}
#tt{position:fixed;bottom:90px;inset-inline:0;margin:auto;width:max-content;max-width:86%;background:#111827;color:#fff;padding:10px 18px;border-radius:22px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}#tt.on{opacity:1}
</style>
</head>
<body>
<div id="app"></div><div id="tt"></div>
<script>
const SB_URL='https://whjyruxlcxgwivyuntub.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndoanlydXhsY3hnd2l2eXVudHViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzODY3NDIsImV4cCI6MjEwODk2Mjc0Mn0.5Mb3qEyfQ5bIFwOl6YvltfSPjdpuKYtya9ENtkbD-6k';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TT={req:'طلبات الموديلز',live:'البثوث الآن',rep:'البلاغات',mod:'الموديلز'},IC={req:'📝',live:'🔴',rep:'⚑',mod:'🎥'};
let S={user:null,admin:false,tab:'req',list:[],sel:null,img:null,nm:{},busy:true};
function toast(t){const e=$('#tt');e.textContent=t;e.className='on';setTimeout(()=>e.className='',2500)}
const av=p=>p&&p.avatar_url?`<img class="av" src="${esc(p.avatar_url)}" alt="">`:`<span class="av">${esc(((p&&p.name)||'؟')[0])}</span>`;
const age=d=>Math.floor((Date.now()-new Date(d))/31557600000);
const ago=d=>{const m=Math.round((Date.now()-new Date(d))/60000);return m<60?m+' د':m<1440?Math.round(m/60)+' س':Math.round(m/1440)+' يوم'};
function login(){return`<div class="login"><img src="icon-192.png" alt=""><h1 style="flex:none">إدارة Batsho</h1><button class="btn g" data-a="google"><b style="color:#4285F4">G</b> الدخول عبر Google</button><input type="email" id="em" placeholder="البريد" dir="ltr"><input type="password" id="pw" placeholder="كلمة المرور" dir="ltr"><button class="btn" data-a="login">دخول بالبريد</button></div>`}
function listHtml(){const t=S.tab,L=S.list;if(S.busy)return'<div class="empty">جارٍ التحميل…</div>';if(!L.length)return'<div class="empty">لا يوجد شيء حاليًا ✅</div>';
if(t=='req')return L.map((r,i)=>`<button class="row" data-a="open" data-i="${i}">${av(r.profiles)}<div class="tx"><b>${esc((r.profiles||{}).name)}</b><small>ميلاد ${esc(r.birth_date)} (عمر ${age(r.birth_date)}) · منذ ${ago(r.created_at)}</small></div>›</button>`).join('');
if(t=='live')return L.map(l=>`<div class="row"><div class="tx"><b>${esc(l.title)}</b><small>${esc((l.profiles||{}).name)} · منذ ${ago(l.started_at)}</small></div><button class="btn sm red" data-a="endlive" data-id="${l.id}">إنهاء</button></div>`).join('');
if(t=='rep')return L.map(r=>{const k=r.target,nm=S.nm[k]||k,ty=k[0]=='u'?'مستخدم':k[0]=='r'?'غرفة':'بث';return`<div class="box"><b>${ty}: ${esc(nm)}</b><small style="display:block;color:var(--m)">بلاغ من ${esc(S.nm['u:'+r.reporter]||'؟')} · منذ ${ago(r.created_at)}</small><div class="acts">${k[0]=='l'?`<button class="btn sm red" data-a="endlive" data-id="${k.slice(2)}">إنهاء البث</button>`:''}<button class="btn sm gr" data-a="handled" data-id="${r.id}">تمت المعالجة</button></div></div>`}).join('');
return L.map(m=>`<div class="row">${av(m.profiles)}<div class="tx"><b>${esc((m.profiles||{}).name)}</b><small>معتمدة منذ ${ago(m.approved_at)}</small></div><button class="btn sm red" data-a="revoke" data-id="${m.user_id}">إلغاء</button></div>`).join('')}
function detail(){const r=S.sel,p=r.profiles||{};return`<header><button class="btn sm gh" data-a="back">➜ رجوع</button><h1>${esc(p.name)}</h1></header><main><div class="box"><div style="display:flex;gap:12px;align-items:center">${av(p)}<div><b>${esc(p.name)}</b><small style="display:block;color:var(--m)">${esc(p.city||'')}</small></div></div><p style="margin-top:10px">تاريخ الميلاد: <b>${esc(r.birth_date)}</b> (العمر ${age(r.birth_date)})</p></div><div class="box"><b>صورة الهوية</b>${S.img?`<img class="big" src="${esc(S.img)}" alt="">`:'<div class="empty" style="padding:30px">جارٍ التحميل…</div>'}</div><div class="box"><b>الصورة الشخصية</b>${p.avatar_url?`<img class="big" src="${esc(p.avatar_url)}" alt="">`:'<div class="warn">لا توجد صورة شخصية</div>'}</div><div class="box"><b>ملاحظة (إلزامية عند الرفض)</b><textarea id="nt" rows="2" maxlength="200" placeholder="سبب الرفض يظهر للمستخدمة"></textarea><div class="acts"><button class="btn gr" data-a="yes">موافقة</button><button class="btn red" data-a="no">رفض</button></div><small style="display:block;color:var(--m);margin-top:8px">تُحذف صورة الهوية تلقائيًا بعد القرار.</small></div></main>`}
function render(){const a=$('#app');
if(S.busy&&!S.user){a.innerHTML='<div class="empty" style="margin:auto">…</div>';return}
if(!S.user){a.innerHTML=login();return}
if(!S.admin){a.innerHTML='<div class="login"><h1 style="flex:none">لا توجد صلاحية</h1><p style="color:var(--m)">هذا الحساب غير مسجّل كمدير.</p><button class="btn" data-a="out">تسجيل الخروج</button></div>';return}
if(S.sel){a.innerHTML=detail();return}
a.innerHTML=`<header><h1>${TT[S.tab]}${S.busy?'':' ('+S.list.length+')'}</h1><button class="btn sm gh" data-a="refresh">↻</button><button class="btn sm gh" data-a="out">خروج</button></header><main>${listHtml()}</main><nav>${Object.keys(TT).map(t=>`<button class="${t==S.tab?'on':''}" data-a="tab" data-t="${t}"><i>${IC[t]}</i>${TT[t]}</button>`).join('')}</nav>`}
async function load(){S.busy=true;S.sel=null;render();const t=S.tab;let r;
if(t=='req')r=await sb.from('model_requests').select('*').eq('status','pending').order('id');
else if(t=='live')r=await sb.from('lives').select('id,title,host,started_at').is('ended_at',null).order('id',{ascending:false});
else if(t=='rep')r=await sb.from('reports').select('*').eq('handled',false).order('id',{ascending:false}).limit(100);
else r=await sb.from('models').select('user_id,approved_at');
if(r.error)toast('تعذر التحميل: '+String(r.error.message).slice(0,90));S.list=r.data||[];
const key=t=='live'?'host':'user_id';if(t!='rep'&&S.list.length){const ids=[...new Set(S.list.map(x=>x[key]))],{data:ps}=await sb.from('profiles').select('id,name,avatar_url,city').in('id',ids),m={};(ps||[]).forEach(q=>m[q.id]=q);S.list.forEach(x=>x.profiles=m[x[key]]||null)}
if(t=='rep'){const u=new Set(),l=new Set();S.list.forEach(x=>{if(x.reporter)u.add(x.reporter);if(x.target.startsWith('u:'))u.add(x.target.slice(2));if(x.target.startsWith('l:'))l.add(x.target.slice(2))});
const[p,q]=await Promise.all([u.size?sb.from('profiles').select('id,name').in('id',[...u]):{data:[]},l.size?sb.from('lives').select('id,title').in('id',[...l]):{data:[]}]);
S.nm={};(p.data||[]).forEach(x=>S.nm['u:'+x.id]=x.name);(q.data||[]).forEach(x=>S.nm['l:'+x.id]=x.title)}
S.busy=false;render()}
async function boot(){const{data:{session}}=await sb.auth.getSession();
if(!session){S.user=null;S.busy=false;return render()}
S.user=session.user;const{data}=await sb.from('admins').select('user_id').eq('user_id',S.user.id).maybeSingle();S.admin=!!data;
if(S.admin)return load();S.busy=false;render()}
async function decide(ok){const r=S.sel,note=$('#nt').value.trim();if(!ok&&!note)return toast('اكتب سبب الرفض');
if(!confirm(ok?'الموافقة على هذا الطلب؟':'رفض هذا الطلب؟'))return;
const{data,error}=await sb.from('model_requests').update({status:ok?'approved':'rejected',note:note||null}).eq('id',r.id).select();
if(error||!data.length)return toast('تعذر حفظ القرار');
await sb.storage.from('verify').remove([r.id_path]);toast(ok?'تمت الموافقة':'تم الرفض');load()}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const d=b.dataset;
switch(d.a){
case'google':await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});break;
case'login':{const{error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(error)return toast('بيانات الدخول غير صحيحة');boot();break}
case'out':await sb.auth.signOut();S={user:null,admin:false,tab:'req',list:[],sel:null,img:null,nm:{},busy:false};render();break;
case'tab':S.tab=d.t;load();break;
case'refresh':load();break;
case'open':{S.sel=S.list[+d.i];S.img=null;render();const{data}=await sb.storage.from('verify').createSignedUrl(S.sel.id_path,300);S.img=data&&data.signedUrl;if(S.sel)render();if(!S.img)toast('تعذر فتح صورة الهوية');break}
case'back':S.sel=null;render();break;
case'yes':decide(true);break;
case'no':decide(false);break;
case'endlive':{if(!confirm('إنهاء هذا البث؟'))return;const{data,error}=await sb.from('lives').update({ended_at:new Date().toISOString()}).eq('id',d.id).select();if(error||!data.length)return toast('تعذر الإنهاء');toast('تم إنهاء البث');load();break}
case'handled':{const{error}=await sb.from('reports').update({handled:true}).eq('id',d.id);if(error)return toast('تعذر الحفظ');load();break}
case'revoke':{if(!confirm('إلغاء صلاحية البث لهذه الموديلز؟'))return;await sb.from('models').delete().eq('user_id',d.id);await sb.from('lives').update({ended_at:new Date().toISOString()}).eq('host',d.id).is('ended_at',null);toast('تم الإلغاء');load();break}
}});
boot();
</script>
</body>
</html>
